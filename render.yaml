# ============================================================
# SriPon - Render Blueprint
# Backend web service + Redis. See docs/deployment.md.
# ============================================================

services:
  - type: web
    name: sripon-api
    runtime: python
    rootDir: backend
    plan: free # 512 MB, sleeps after ~15 min of no traffic (cold start on wake)
    autoDeploy: true
    buildCommand: npm --prefix ../admin ci && npm --prefix ../admin run build && python -m pip install --upgrade pip && pip install -r requirements.txt
    # Free tier can't use preDeployCommand, so migrations + static files run
    # at boot (startCommand) before gunicorn serves traffic.
    startCommand: python manage.py migrate --noinput && python manage.py collectstatic --noinput && gunicorn config.wsgi:application --workers 1 --threads 4 --timeout 120 --bind 0.0.0.0:$PORT
    healthCheckPath: /health/
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings.production
      - key: DJANGO_DEBUG
        value: "false"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_ALLOWED_HOSTS
        value: "*"
      - key: DATABASE_URL
        sync: false # set to your Supabase PostgreSQL URL (sslmode=require)
      - key: REDIS_URL
        fromService:
          type: redis
          name: sripon-redis
          property: connectionString
      - key: CORS_ALLOWED_ORIGINS
        value: "https://www.sripon.in,https://admin.sripon.in"
      - key: FIREBASE_PROJECT_ID
        sync: false
      - key: FIREBASE_CLIENT_EMAIL
        sync: false
      - key: FIREBASE_PRIVATE_KEY
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_PUBLISHABLE_KEY
        sync: false # anon / publishable key
      - key: SUPABASE_SECRET_KEY
        sync: false # service role key (backend only)
      - key: SUPABASE_JWKS_URL
        sync: false # e.g. https://<project>.supabase.co/auth/v1/.well-known/jwks.json
      - key: SUPABASE_JWT_SECRET
        sync: false # legacy shared secret; only used when SUPABASE_JWKS_URL is blank
      # Admin SPA build-time env (inlined by Vite during npm run build):
      - key: VITE_SUPABASE_URL
        sync: false # same value as SUPABASE_URL (admin auth)
      - key: VITE_SUPABASE_ANON_KEY
        sync: false # same value as SUPABASE_PUBLISHABLE_KEY
      - key: VITE_API_BASE_URL
        value: /api/v1
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: CLOUDINARY_FOLDER
        value: sripon
      - key: PAYMENT_PROVIDER
        value: MOCK
      - key: PIP_PREFER_BINARY
        value: "1"
      - key: PIP_NO_BUILD_ISOLATION
        value: "0"

  - type: redis
    name: sripon-redis
    plan: free
    maxmemoryPolicy: allkeys-lru
    ipAllowList: []