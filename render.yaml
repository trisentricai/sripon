# ============================================================
# SriPon - Render Blueprint
# Backend web service + Redis. See docs/deployment.md.
# ============================================================

services:
  - type: web
    name: sripon-api
    runtime: python
    rootDir: backend
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn config.wsgi:application --workers 2 --timeout 120 --bind 0.0.0.0:$PORT
    preDeployCommand: python manage.py migrate --noinput && python manage.py collectstatic --noinput
    healthCheckPath: /health/
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings.production
      - key: DJANGO_DEBUG
        value: "false"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_ALLOWED_HOSTS
        value: "*"
      - key: DATABASE_URL
        sync: false # set to your Supabase PostgreSQL URL (sslmode=require)
      - key: REDIS_URL
        fromService:
          type: redis
          name: sripon-redis
          property: connectionString
      - key: CORS_ALLOWED_ORIGINS
        value: "https://www.sripon.in,https://admin.sripon.in"
      - key: FIREBASE_PROJECT_ID
        sync: false
      - key: FIREBASE_CLIENT_EMAIL
        sync: false
      - key: FIREBASE_PRIVATE_KEY
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_JWT_SECRET
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: CLOUDINARY_FOLDER
        value: sripon
      - key: PAYMENT_PROVIDER
        value: MOCK

  - type: redis
    name: sripon-redis
    plan: free
    maxmemoryPolicy: allkeys-lru
    ipAllowList: []